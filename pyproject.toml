[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legolizer"
version = "0.1.0"
description = "Reproducible 3D conversion and mesh-to-LEGO pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "h5py>=3.10",
  "numpy>=1.24",
  "open3d>=0.19,<0.20",
  "Pillow>=10",
  "scipy>=1.10",
  "scikit-image>=0.22",
  "trimesh>=4.0",
]

[project.scripts]
legolizer = "legolizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"legolizer.ui" = ["static/*.html", "static/*.css", "static/*.js"]
