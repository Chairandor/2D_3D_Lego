<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LEGO 候选方案比较</title>
<style>
:root{--paper:#f4f1e8;--card:#fffdf8;--ink:#222820;--muted:#687268;--line:#d8d9ce;--green:#397a58;--blue:#345995}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#ece9dd,#f8f7f0 55%,#e9f0e7);color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",sans-serif}
.shell{max-width:1500px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:20px}.top a{color:var(--blue);text-decoration:none;font-size:13px;font-weight:700}.eyebrow{color:var(--green);font-size:12px;font-weight:800;letter-spacing:.08em}.top h1{font-size:30px;margin:5px 0 6px}.top p{font-size:13px;line-height:1.5;color:var(--muted);margin:0}.summary{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px 17px;margin-bottom:17px}.summary strong{display:block;margin-bottom:5px}.summary p{font-size:12px;line-height:1.55;color:var(--muted);margin:0}.comparison-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.comparison-option{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px;min-width:0;box-shadow:0 10px 26px #343f2c0b}.comparison-option.selected{border-color:var(--green);box-shadow:0 0 0 2px #397a5825}.option-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;min-height:42px}.comparison-option h2{font-size:15px;line-height:1.35;margin:0}.tag{display:inline-block;white-space:nowrap;border-radius:7px;background:#e5efdf;color:#2e6947;padding:3px 7px;font-size:11px;font-weight:750}.tag.original{background:#e8edf6;color:#3c5a86}.model-preview,.model-preview-missing{position:relative;height:290px;display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(#eee 0 25%,#ddd 0 50%) 50%/20px 20px;border-radius:9px;color:#5e625a;font-size:12px;text-align:center;touch-action:none}.model-preview canvas{display:block;width:100%;height:100%;cursor:grab}.model-preview canvas:active{cursor:grabbing}.preview-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;background:#ffffffb8}.facts{display:flex;gap:5px;flex-wrap:wrap;min-height:58px;margin:11px 0 8px}.facts span{padding:4px 7px;background:#f1f1e9;border-radius:6px;color:#5d685d;font-size:11px;height:max-content}.option-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}.option-foot button,.selected-path button{border:0;border-radius:9px;background:#dfebdf;color:#285d3e;padding:9px 12px;font:inherit;font-size:12px;font-weight:750;cursor:pointer}.option-foot button:hover,.selected-path button:hover{filter:brightness(.96)}.option-foot button:disabled{opacity:.5;cursor:not-allowed}.option-foot a{font-size:12px;color:var(--blue);text-decoration:none}.selected-path{position:sticky;bottom:12px;z-index:10;background:#e9f3e7;border:1px solid #bcd1bc;border-radius:13px;padding:13px 16px;box-shadow:0 12px 35px #263d2630;margin:18px 0}.selected-path[hidden]{display:none}.selected-path label{display:block;font-size:13px;font-weight:750;margin-bottom:7px}.fileline{display:flex;gap:8px}.fileline input{flex:1;min-width:0;border:1px solid #bad0b8;border-radius:8px;padding:8px;font:12px Consolas,monospace;background:white}.selected-path small{display:block;margin-top:6px;color:var(--muted);font-size:11px}.error{padding:24px;background:#f9e2dc;border:1px solid #ddaa9d;border-radius:12px;color:#863b2b}#loading{padding:30px;color:var(--muted);text-align:center}
@media(max-width:1100px){.comparison-list{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.shell{padding:16px}.comparison-list{grid-template-columns:1fr}.top{flex-direction:column-reverse}.top h1{font-size:24px}.fileline{flex-direction:column}}
</style>
</head>
<body><main class="shell">
<header class="top"><div><div class="eyebrow">LEGOLIZATION / BUNDLE</div><h1 id="title">候选方案比较</h1><p id="subtitle">正在读取比较报告……</p></div><a href="/">← 返回流水线</a></header>
<section id="summary" class="summary" hidden><strong>如何使用</strong><p>拖动模型可查看不同角度。比较原版和 Bundle 候选后，点“选择此方案”即可得到该文件的本机路径；目前不会更改卡片、模型、零件清单或说明书。</p></section>
<div id="loading">正在读取候选方案……</div><div id="error" class="error" hidden></div><section id="comparisonList" class="comparison-list"></section>
<section id="selectedPath" class="selected-path" hidden><label for="selectedPathValue">所选方案的本机文件路径</label><div class="fileline"><input id="selectedPathValue" type="text" readonly><button id="copyPath" type="button">复制路径</button></div><small id="copyStatus">这里只返回路径，不修改任何文件。</small></section>
</main>
<script type="importmap">{"imports":{"three":"/static/three/three.module.js","three/addons/":"/static/three/addons/"}}</script>
<script type="module" src="/static/comparison-page.js"></script>
</body></html>
