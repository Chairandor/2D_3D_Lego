<style>
#threeWorkflow{grid-template-columns:420px minmax(0,1fr)}#threeWorkflow>.panel,.three-view-card,.three-fields>div{min-width:0}.three-view-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.three-step-list{min-width:0;max-width:100%;overflow-x:auto}.three-stats{overflow-wrap:anywhere}.mode-switch{flex-wrap:wrap}
#threeWorkflow[hidden],#imageWorkflow[hidden]{display:none}.mode-switch{display:flex;gap:8px;margin:0 0 18px}.mode-switch button{border:1px solid var(--line);background:var(--panel)}.mode-switch button.active{background:var(--yellow);border-color:#d9b340}.three-view-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three-view-card{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--panel)}.three-view-title{font-size:13px;font-weight:750;padding:10px 12px;border-bottom:1px solid var(--line)}.three-viewport{height:310px;position:relative;touch-action:none;background:#f1efe7}.three-viewport canvas{width:100%;height:100%;display:block;cursor:grab}.three-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;color:var(--muted);font-size:13px;text-align:center;pointer-events:none}.three-stage-assets{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.three-stage-assets button{padding:7px 10px;font-size:12px;border:1px solid var(--line);background:#f6f3eb}.three-stage-assets button.active{border-color:var(--green);background:#e2eddf}.three-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three-fields label{margin-top:9px}.three-fields input,.three-fields select{padding:8px}.three-checks{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.three-check{flex:1;min-width:130px;background:#f0ede5;border:1px solid var(--line);border-radius:10px;padding:9px;font-size:12px}.three-check b{display:block;margin-top:5px;font-size:15px}.three-check.pass{background:#e6efe2;color:#315e40}.three-check.warn{background:#fff1c7;color:#715300}.three-check.fail{background:#f7d7d2;color:#842f23}.three-downloads{display:flex;gap:8px;flex-wrap:wrap}.three-downloads a{font-size:12px;color:var(--blue);padding:7px 9px;border:1px solid var(--line);border-radius:8px;text-decoration:none;background:var(--panel)}.three-step-controls{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}.three-step-controls input{flex:1;min-width:100px;padding:0}.three-step-controls button{padding:7px 10px;font-size:12px}.three-step-list{display:flex;gap:6px;overflow:auto;max-height:100px;margin-top:8px}.three-step-list button{padding:6px 9px;font-size:12px;white-space:nowrap}.three-step-list button.current{background:var(--yellow)}.three-step-list button.unstable{border:1px solid var(--red)}.three-file-name{overflow-wrap:anywhere}.three-atlas{max-width:100%;max-height:300px;object-fit:contain;display:block;margin:auto}.three-texture-image[hidden]{display:none}.three-title-row{display:flex;justify-content:space-between;align-items:center;gap:8px}.three-title-row h2{margin-bottom:4px}.three-title-row button{padding:6px 10px;font-size:12px}.three-steps{grid-template-columns:repeat(auto-fit,minmax(84px,1fr))}.three-steps .step{border:1px solid transparent;cursor:pointer}.three-steps .step.chosen{border-color:var(--green)}.three-steps .step.failed{background:#f7d7d2;color:#842f23}.three-run-path{word-break:break-all}.three-log{height:170px}.three-history{margin-top:14px}.three-stats{white-space:pre-wrap;font-size:12px;color:var(--muted);line-height:1.6}.three-small-action{padding:7px 10px!important;font-size:12px}.three-preview-hint{font-size:11px;color:var(--muted);margin:7px 0 0}
@media(max-width:1100px){#threeWorkflow{grid-template-columns:310px minmax(0,1fr)}.three-view-grid{grid-template-columns:1fr}.three-viewport{height:270px}}@media(max-width:900px){#threeWorkflow{grid-template-columns:1fr}.three-view-grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.three-view-grid,.three-fields{grid-template-columns:1fr}.three-viewport{height:270px}.mode-switch button{font-size:12px}.three-fields{gap:0}.three-step-controls{gap:5px}}
</style>
<div id="threeWorkflow" class="grid" hidden>
<section class="panel">
<h2>3D 输入与转换</h2>
<label for="threeFlow">转换路径</label><select id="threeFlow"><option value="stl">STL → LEGO · Bunny</option><option value="ply_plain">无色 PLY → Mesh → LEGO · Rhino</option><option value="ply_color">有色 PLY → Mesh / 贴图 → LEGO · Tiko</option></select>
<label>输入文件</label><div class="fileline"><button id="threeDemo" type="button">载入默认示例</button><button id="threeChoose" type="button">选择文件</button></div><input id="threeFile" type="file" accept=".stl" hidden>
<p id="threeSourceName" class="hint three-file-name">默认示例：bunny.stl</p><p id="threeFlowNote" class="hint"></p>
<div class="three-fields">
<div><label for="threeUnit">1 源单位 = 毫米</label><input id="threeUnit" type="number" value="1000" min="0.000000001" step="any"></div>
<div><label for="threeAxis">源上轴</label><select id="threeAxis"><option value="y">+Y</option><option value="z">+Z</option><option value="x">+X</option><option value="-y">−Y</option><option value="-z">−Z</option><option value="-x">−X</option><option value="auto">Auto（仅 STL）</option></select></div>
<div><label for="threeStuds">LEGO 宽度 / stud</label><input id="threeStuds" type="number" value="12" min="4" max="64" step="1"></div>
<div><label for="threeColor">单色 / 备用 LDraw 色号</label><input id="threeColor" type="number" value="4" min="0" max="10000"></div>
</div>
<div id="threeReconstruction"><div class="three-fields"><div><label for="threeDepth">Poisson 深度</label><input id="threeDepth" type="number" value="7" min="5" max="10"></div><div><label for="threeDensity">密度过滤分位数</label><input id="threeDensity" type="number" value="0.005" min="0" max="0.2" step="0.001"></div></div></div>
<div class="three-fields"><div><label for="threeQuality">后端求解策略</label><select id="threeQuality"><option value="direct">单策略（推荐）</option><option value="fast">多候选快速</option><option value="balanced">多候选均衡</option></select></div><div><label for="threeDuration">求解预算 / 秒</label><input id="threeDuration" type="number" value="60" min="5" max="3600"></div></div>
<label for="threeInstructionMode">装配步骤</label><select id="threeInstructionMode"><option value="layer">按层基础步骤（快速演示）</option><option value="smart">Smart 结构规划</option></select>
<p class="hint">按目标 stud 定尺，实体体素，table 支撑。预算不是整个进程的墙钟时限。</p>
<div class="actions"><button id="threePrepare" type="button">处理并预览</button><button id="threeRun" type="button" class="primary">转换并生成 LEGO</button><button id="threeStop" type="button" class="danger" disabled>停止当前任务</button></div>
<div class="three-history"><label for="threeHistory">本路径的运行记录</label><select id="threeHistory"><option value="">暂无运行记录</option></select><button id="threeLoadHistory" class="three-small-action" type="button">载入所选结果</button></div>
<p class="hint">原文件保留；每次转换创建独立目录。STL 下载不包含颜色。</p>
</section>
<section class="panel">
<div class="three-title-row"><h2 id="threeTitle">STL → LEGO</h2><span id="threeBadge" class="badge">就绪</span></div>
<div id="threeStages" class="steps three-steps"></div><div id="threeNotice" class="notices"></div>
<div class="three-view-grid">
<div class="three-view-card"><div class="three-view-title">原始输入 <span id="threeInputKind"></span></div><div id="threeSourceView" class="three-viewport"><div class="three-placeholder">载入示例或选择文件</div></div></div>
<div class="three-view-card"><div id="threeResultTitle" class="three-view-title">求解 LEGO / 阶段产物</div><div id="threeResultView" class="three-viewport"><div class="three-placeholder">处理后显示 Mesh、贴图、体素或 LEGO</div></div><div id="threeTextureImage" class="three-texture-image" hidden><img id="threeAtlas" class="three-atlas" alt="点云 RGB 烘焙的 UV 贴图"></div></div>
</div>
<p class="three-preview-hint">拖动旋转 · 滚轮缩放 · 原始输入预览只做单位和显示方向变换</p>
<div id="threeAssets" class="three-stage-assets"></div>
<div id="threeStepControls" hidden><div class="three-step-controls"><button id="threePrevious" type="button">上一步</button><input id="threeStep" type="range" min="1" max="1" value="1"><button id="threeNext" type="button">下一步</button><button id="threePlay" type="button">播放</button><span id="threeStepValue">1 / 1</span></div><div id="threeStepList" class="three-step-list"></div><p id="threeStepNote" class="hint"></p></div>
<div id="threeChecks" class="three-checks"></div><p id="threeAssetNote" class="hint"></p><div id="threeStats" class="three-stats"></div>
<h2 style="font-size:15px;margin-top:18px">阶段产物下载</h2><div id="threeDownloads" class="three-downloads"></div>
<div class="meta"><span id="threeElapsed">0 秒</span><span id="threeRunPath" class="three-run-path">尚未运行</span></div>
<details><summary class="hint">查看运行日志</summary><pre id="threeLog" class="log three-log">等待任务……</pre></details>
</section>
</div>
