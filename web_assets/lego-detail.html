<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LEGO 模型详情</title>
<style>
:root{--paper:#f5f3ec;--card:#fffdf8;--ink:#253028;--muted:#798174;--line:#dedfd2;--green:#397a58;--yellow:#f2c94c}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:radial-gradient(ellipse at 50% 35%,#fcfbf5,var(--paper) 75%);color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer;border:0;color:inherit}button:disabled{cursor:default;opacity:.55}.page{height:100dvh;display:flex;flex-direction:column;padding:26px 32px}.header{display:flex;align-items:center;gap:18px;min-height:43px}.back{background:#e9e7dc;border-radius:100px;padding:9px 17px;font-size:13px}.heading{min-width:0}.eyebrow{font-size:10px;letter-spacing:.2em;color:var(--green);font-weight:750}.heading h1{font-size:20px;margin:4px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.content{flex:1;min-height:0;margin-top:22px}.menu{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding-bottom:60px}.intro{text-align:center;margin-bottom:38px}.intro h2{font-size:32px;font-weight:650;letter-spacing:-1px;margin:0 0 12px}.intro p{font-size:14px;color:var(--muted);margin:0}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;width:min(100%,990px)}.choice{background:var(--card);border:1px solid var(--line);border-radius:24px;min-height:240px;padding:28px 24px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;box-shadow:0 9px 26px #26362406;transition:transform .18s,border-color .18s,box-shadow .18s}.choice:hover:not(:disabled){transform:translateY(-5px);border-color:#94b29b;box-shadow:0 16px 32px #26362410}.choice .icon{width:58px;height:58px;display:grid;place-items:center;background:#e9f1e5;border-radius:17px;margin-bottom:28px;color:var(--green)}.choice svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}.choice strong{font-size:21px;font-weight:650}.choice small{font-size:12px;color:var(--muted);margin-top:9px;line-height:1.6}.choice.placeholder{background:#f2f0e9;cursor:default;opacity:.7}.product{height:100%;display:grid;grid-template-columns:minmax(0,1.65fr) minmax(320px,1fr);gap:20px}.viewer-panel,.parts-panel{background:var(--card);border:1px solid var(--line);border-radius:20px;min-height:0;overflow:hidden;display:flex;flex-direction:column}.panel-head{padding:19px 22px;border-bottom:1px solid #e8e8df;display:flex;align-items:center;justify-content:space-between}.panel-head h2{font-size:15px;margin:0;font-weight:650}.viewer-area{flex:1;min-height:260px;position:relative;background:repeating-conic-gradient(#f3f3f0 0 25%,#e9eae5 0 50%) 50%/24px 24px}.model-preview{height:100%;position:relative;display:flex;align-items:center;justify-content:center;touch-action:none;color:var(--muted);font-size:13px;text-align:center}.model-preview canvas{display:block;width:100%;height:100%;cursor:grab}.model-preview canvas:active{cursor:grabbing}.preview-loading{position:absolute;inset:0;display:grid;place-items:center;background:#ffffffb8;pointer-events:none}.viewer-foot{padding:13px 22px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:12px}.viewer-foot a{color:var(--green);text-decoration:none}.parts-content{flex:1;min-height:0;overflow:auto}.empty{height:100%;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:25px;color:var(--muted);font-size:13px}.generate{padding:12px 20px;border-radius:12px;background:var(--yellow);color:#454020;font-weight:650}.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:18px 20px 12px}.totals div{padding:12px 8px;background:#f2f3eb;border-radius:12px;text-align:center}.totals b{display:block;font-size:24px;font-weight:650}.totals span{font-size:11px;color:var(--muted)}.search-wrap{padding:0 20px 14px}.search-wrap input{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 11px;font-size:12px}.parts-table{width:100%;border-collapse:collapse;font-size:12px}.parts-table th{text-align:left;position:sticky;top:0;background:#f1f2e9;z-index:1;color:#697360;font-weight:550;padding:11px 16px}.parts-table td{padding:13px 16px;border-bottom:1px solid #efeee7}.parts-table td:last-child,.parts-table th:last-child{text-align:right}.part-name{display:block;font-size:10px;color:var(--muted);margin-top:4px}.colour{display:flex;gap:8px;align-items:center}.swatch{width:13px;height:13px;border-radius:4px;box-shadow:inset 0 0 0 1px #0002;flex:none}.colour small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.comparison{height:100%;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--card)}.comparison iframe{border:0;width:100%;height:100%;display:block}.error{color:#984b3d;white-space:pre-wrap;line-height:1.6;max-width:600px}.loading{display:grid;place-items:center;height:100%;color:var(--muted)}@media(max-width:850px){.page{padding:20px}.choices{gap:12px}.choice{min-height:210px;padding:22px 18px}.choice strong{font-size:18px}.product{grid-template-columns:1fr;overflow:auto}.viewer-panel{min-height:440px}.parts-panel{min-height:360px}.content{overflow:auto}.menu{min-height:520px}.intro h2{font-size:26px}}@media(max-width:550px){.choices{grid-template-columns:1fr}.choice{min-height:110px;padding:18px;display:grid;grid-template-columns:50px 1fr;column-gap:16px}.choice .icon{grid-row:span 2;width:48px;height:48px;margin:0}.choice small{margin:4px 0 0}.menu{justify-content:flex-start;padding:24px 0}.intro{margin-bottom:25px}.intro h2{font-size:23px}.header{gap:10px}.heading h1{font-size:16px}}
.header{padding-right:48px}.menu{min-height:0}
.part-cell{display:flex;align-items:center;gap:10px}.part-thumbnail{width:48px;height:42px;flex:none;border-radius:8px;background:#e9ede7;border:1px solid #dee3d9;display:grid;place-items:center;color:#9aa492;font-size:12px;overflow:hidden}.part-thumbnail img{display:block;width:100%;height:100%;object-fit:contain}.part-meta{min-width:0;overflow-wrap:anywhere}.parts-table .part-name{overflow-wrap:anywhere;line-height:1.5}.parts-table .colour{overflow-wrap:anywhere}.parts-table .colour>span:last-child{min-width:0}.parts-table th:last-child,.parts-table td:last-child{white-space:nowrap}@media(max-width:850px){.part-cell{gap:7px}.part-thumbnail{width:42px;height:38px}.parts-table .colour{gap:5px}}
@media(min-width:701px) and (max-width:850px){.product{grid-template-columns:minmax(0,1.35fr) minmax(280px,1fr);overflow:visible}.viewer-panel,.parts-panel{min-height:0}.viewer-area{min-height:160px}.parts-table td,.parts-table th{padding-left:11px;padding-right:11px}.totals{padding:14px 12px 10px}.search-wrap{padding-left:12px;padding-right:12px}}
@media(min-width:551px) and (max-height:650px){.page{padding:18px 22px}.content{margin-top:14px}.menu{padding-bottom:8px}.intro{margin-bottom:22px}.intro h2{font-size:25px}.choice{min-height:175px;padding:20px 18px}.choice .icon{width:46px;height:46px;margin-bottom:18px;border-radius:13px}.choice svg{width:26px;height:26px}.choice strong{font-size:18px}.choice small{font-size:11px}}
.instruction-layout{height:100%;display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);gap:20px}.step-image-area{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#303436;padding:12px;position:relative}.step-image-area img{width:100%;height:100%;object-fit:contain;min-height:0}.step-head-meta{font-size:12px;color:var(--muted)}.step-note{padding:12px 20px;min-height:44px;font-size:12px;color:var(--muted);line-height:1.6;border-top:1px solid #e8e8df}.step-note.risk{color:#a15c31;background:#fbf1df}.step-parts{padding:10px 20px;overflow:auto;flex:1;min-height:0}.step-part{display:grid;grid-template-columns:86px minmax(0,1fr) auto;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid #efeee7}.step-part img{width:86px;height:65px;object-fit:contain;border-radius:10px;background:#303436}.step-part strong{font-size:14px;font-weight:600}.step-part small{display:block;margin-top:6px;font-size:12px;color:var(--muted)}.step-part b{font-size:22px;font-weight:650}.step-part b span{font-size:11px;font-weight:400;color:var(--muted);margin-left:4px}.step-navigation{padding:18px 20px;border-top:1px solid var(--line)}.step-progress{height:4px;border-radius:4px;overflow:hidden;background:#e6e8db;margin-bottom:15px}.step-progress span{display:block;height:100%;background:var(--green);transition:width .15s}.step-controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}.step-controls button{padding:12px 14px;border-radius:12px;background:#e9e7dc;font-size:13px;font-weight:600}.step-controls button:last-child{background:var(--yellow)}.step-counter{font-size:12px;color:var(--muted);white-space:nowrap}.pdf-download{margin-left:auto;color:var(--green);font-size:12px;text-decoration:none;padding:9px 12px;border:1px solid var(--line);border-radius:10px;white-space:nowrap}.view-toggle{background:#e9e7dc;border-radius:8px;padding:7px 10px;font-size:11px}.generation-box{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;gap:16px}.generation-box h2{font-size:23px;margin:5px 0 0}.generation-box p{font-size:13px;color:var(--muted);margin:0;line-height:1.8;max-width:540px;white-space:pre-wrap;overflow-wrap:anywhere}.spinner{width:40px;height:40px;border:3px solid #dde4d5;border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:850px){.instruction-layout{gap:12px;grid-template-columns:minmax(0,1.3fr) minmax(260px,1fr)}.step-parts{padding:7px 12px}.step-part{grid-template-columns:65px minmax(0,1fr) auto;gap:9px}.step-part img{width:65px;height:52px}.step-part strong{font-size:12px}.step-part small{font-size:11px}.step-part b{font-size:18px}.step-controls{gap:8px}.step-navigation{padding:14px 12px}}
@media(max-width:620px){.instruction-layout{display:flex;flex-direction:column;height:auto;min-height:100%;padding-bottom:10px}.instruction-layout>.viewer-panel{height:390px;min-height:300px;flex-shrink:0}.instruction-layout>.parts-panel{min-height:280px;max-height:520px;flex-shrink:0}.pdf-download{font-size:11px;padding:8px}.step-parts{min-height:100px}.header{flex-wrap:wrap}.heading{flex:1}.step-image-area{min-height:200px}}
</style>
</head>
<body><main class="page">
<header class="header"><button id="back" class="back" hidden>← 返回</button><div class="heading"><span class="eyebrow">LEGO / MODEL</span><h1 id="title">LEGO 模型</h1></div><button id="exportParts" class="pdf-download" hidden>导出零件清单 ↓</button><a id="downloadInstructions" class="pdf-download" download hidden>下载 PDF ↓</a></header>
<div class="content">
<section id="menu" class="menu">
  <div class="intro"><h2>探索你的 LEGO 模型</h2><p>选择你想查看的内容</p></div>
  <div class="choices">
    <button id="showProduct" class="choice"><span class="icon"><svg viewBox="0 0 32 32"><path d="m16 3 12 7v13l-12 7-12-7V10zM4 10l12 7 12-7M16 17v13M10 6.5l12 7"/></svg></span><strong>成品展示</strong><small>旋转查看模型与零件统计</small></button>
    <button id="showInstructions" class="choice"><span class="icon"><svg viewBox="0 0 32 32"><path d="M6 4h15l5 5v19H6zM21 4v6h5M11 15h10M11 20h10"/></svg></span><strong>生成说明书</strong><small>逐步查看拼搭过程与所需零件</small></button>
    <button id="showComparison" class="choice"><span class="icon"><svg viewBox="0 0 32 32"><rect x="3" y="7" width="10" height="18" rx="2"/><rect x="19" y="7" width="10" height="18" rx="2"/><path d="m12 3 4 3 4-3M16 6v22"/></svg></span><strong>候选方案比较</strong><small>比较不同构建并选择方案</small></button>
  </div>
</section>
<section id="product" class="product" hidden>
  <div class="viewer-panel"><div class="panel-head"><h2>成品展示</h2></div><div id="viewer" class="viewer-area"></div><div class="viewer-foot"><span>拖拽旋转 · 滚轮缩放</span><a id="download" download>下载模型 ↓</a></div></div>
  <div class="parts-panel"><div class="panel-head"><h2>零件统计</h2><span id="mass" style="font-size:11px;color:var(--muted)"></span></div><div id="partsExportMessage" role="status" style="padding:10px 20px;font-size:12px;line-height:1.6;color:var(--muted);overflow-wrap:anywhere" hidden></div><div id="parts" class="parts-content"></div></div>
</section>
<section id="comparison" class="comparison" hidden></section>
<section id="instructions" style="height:100%" hidden>
  <div id="instructionWaiting" class="generation-box"><div id="instructionSpinner" class="spinner"></div><h2 id="instructionStatus">正在读取说明书</h2><p id="instructionProgress"></p><p id="instructionWaitHint">可以返回其他页面，生成会继续。</p><button id="retryInstructions" class="generate" hidden>重新尝试</button></div>
  <div id="instructionReader" class="instruction-layout" hidden>
    <div class="viewer-panel"><div class="panel-head"><h2 id="stepHeading">第 01 步</h2><button id="alternateStep" class="view-toggle" hidden>查看另一侧</button><span id="stepRole" class="step-head-meta">主模型</span></div><div class="step-image-area"><img id="stepImage" alt="当前拼搭步骤" hidden><canvas id="stepCanvas" role="img" aria-label="当前拼搭步骤" style="width:100%;height:100%;min-height:0"></canvas><span id="stepImageStatus" style="position:absolute;color:#cbd1c9;font-size:12px">正在加载步骤图……</span></div><div id="stepNote" class="step-note">黄色边线标记本步新增内容。</div></div>
    <div class="parts-panel"><div class="panel-head"><h2 id="stepPartsHeading">本步所需零件</h2></div><div id="stepParts" class="step-parts"></div><div class="step-navigation"><div class="step-progress"><span id="stepProgress"></span></div><div class="step-controls"><button id="previousStep">← 上一步</button><span id="stepCounter" class="step-counter"></span><button id="nextStep">下一步 →</button></div></div></div>
  </div>
</section>
<div id="message" class="loading" hidden></div>
</div></main>
<script type="importmap">{"imports":{"three":"/static/three/three.module.js","three/addons/":"/static/three/addons/"}}</script>
<script type="module" src="/static/lego-detail.js"></script>
</body></html>
